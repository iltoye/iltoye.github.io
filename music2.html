<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频响应式全屏动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: none;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        .file-input {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .file-input.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .file-input:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        #fileInput {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .instructions {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .sub-text {
            font-size: 14px;
            opacity: 0.7;
        }

        audio {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="file-input" id="fileInputDiv">
        <div class="instructions">选择音频文件开始可视化</div>
        <div class="sub-text">支持 MP3, WAV, OGG 格式</div>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
            选择音频文件
        </button>
        <input type="file" id="fileInput" accept="audio/*">
    </div>

    <audio id="audio" controls></audio>

    <script>
        class AudioVisualizer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.audio = document.getElementById('audio');
                this.fileInput = document.getElementById('fileInput');
                this.fileInputDiv = document.getElementById('fileInputDiv');

                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.source = null;
                this.isPlaying = false;

                this.particles = [];
                this.time = 0;
                this.bassHistory = [];
                this.midHistory = [];
                this.trebleHistory = [];

                this.init();
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                this.fileInput.addEventListener('change', (e) => this.loadAudioFile(e));

                // 拖拽上传
                document.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.fileInputDiv.style.borderColor = 'rgba(255, 255, 255, 0.8)';
                });

                document.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    this.fileInputDiv.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                });

                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.fileInputDiv.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                    const files = e.dataTransfer.files;
                    if (files.length > 0 && files[0].type.startsWith('audio/')) {
                        this.handleFile(files[0]);
                    }
                });

                this.createParticles();
                this.animate();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            loadAudioFile(event) {
                const file = event.target.files[0];
                if (file) {
                    this.handleFile(file);
                }
            }

            handleFile(file) {
                const url = URL.createObjectURL(file);
                this.audio.src = url;
                this.audio.load();

                this.audio.addEventListener('canplaythrough', () => {
                    this.setupAudioContext();
                    this.fileInputDiv.classList.add('hidden');
                    this.audio.play();
                });
            }

            setupAudioContext() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 512;
                this.analyser.smoothingTimeConstant = 0.8;

                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

                this.source = this.audioContext.createMediaElementSource(this.audio);
                this.source.connect(this.analyser);
                this.analyser.connect(this.audioContext.destination);

                this.isPlaying = true;
            }

            createParticles() {
                this.particles = [];
                const particleCount = 150;

                for (let i = 0; i < particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        baseX: Math.random() * this.canvas.width,
                        baseY: Math.random() * this.canvas.height,
                        vx: 0,
                        vy: 0,
                        size: Math.random() * 2 + 0.5,
                        baseSize: Math.random() * 2 + 0.5,
                        angle: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.02 + 0.01,
                        color: {
                            h: Math.random() * 360,
                            s: 70,
                            l: 60
                        }
                    });
                }
            }

            getFrequencyData() {
                if (!this.analyser || !this.dataArray) return null;

                this.analyser.getByteFrequencyData(this.dataArray);

                const bass = this.getAverageFreq(0, 10);
                const mid = this.getAverageFreq(10, 100);
                const treble = this.getAverageFreq(100, this.dataArray.length);

                // 保存历史数据用于平滑过渡
                this.bassHistory.push(bass);
                this.midHistory.push(mid);
                this.trebleHistory.push(treble);

                if (this.bassHistory.length > 10) {
                    this.bassHistory.shift();
                    this.midHistory.shift();
                    this.trebleHistory.shift();
                }

                return {
                    bass: bass,
                    mid: mid,
                    treble: treble,
                    bassAvg: this.bassHistory.reduce((a, b) => a + b) / this.bassHistory.length,
                    midAvg: this.midHistory.reduce((a, b) => a + b) / this.midHistory.length,
                    trebleAvg: this.trebleHistory.reduce((a, b) => a + b) / this.trebleHistory.length,
                    raw: this.dataArray
                };
            }

            getAverageFreq(start, end) {
                let sum = 0;
                for (let i = start; i < end && i < this.dataArray.length; i++) {
                    sum += this.dataArray[i];
                }
                return sum / (end - start);
            }

            drawBackground(audioData) {
                if (!audioData) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    return;
                }

                // 根据低频创建脉动背景
                const bassIntensity = audioData.bass / 255;
                const alpha = 0.02 + bassIntensity * 0.08;

                this.ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 添加径向渐变效果
                if (bassIntensity > 0.3) {
                    const gradient = this.ctx.createRadialGradient(
                        this.canvas.width / 2, this.canvas.height / 2, 0,
                        this.canvas.width / 2, this.canvas.height / 2, this.canvas.width / 2
                    );

                    const hue = (this.time * 0.5) % 360;
                    gradient.addColorStop(0, `hsla(${hue}, 70%, 20%, ${bassIntensity * 0.1})`);
                    gradient.addColorStop(1, 'transparent');

                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }

            drawParticles(audioData) {
                if (!audioData) return;

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                this.particles.forEach((particle, index) => {
                    const freqIndex = Math.floor((index / this.particles.length) * audioData.raw.length);
                    const freq = audioData.raw[freqIndex] / 255;

                    // 根据音频数据调整粒子属性
                    const bassInfluence = audioData.bass / 255;
                    const midInfluence = audioData.mid / 255;
                    const trebleInfluence = audioData.treble / 255;

                    // 更新粒子位置 - 围绕中心旋转
                    particle.angle += particle.speed + bassInfluence * 0.02;
                    const radius = 100 + midInfluence * 200 + Math.sin(this.time * 0.01 + index) * 50;

                    particle.x = centerX + Math.cos(particle.angle) * radius;
                    particle.y = centerY + Math.sin(particle.angle) * radius;

                    // 根据高频调整粒子大小
                    particle.size = particle.baseSize + trebleInfluence * 8;

                    // 动态颜色变化
                    particle.color.h = (particle.color.h + freq * 2) % 360;
                    particle.color.l = 40 + freq * 40;

                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);

                    // 添加发光效果
                    const glowSize = particle.size + bassInfluence * 10;
                    const gradient = this.ctx.createRadialGradient(
                        particle.x, particle.y, 0,
                        particle.x, particle.y, glowSize
                    );

                    gradient.addColorStop(0, `hsla(${particle.color.h}, ${particle.color.s}%, ${particle.color.l}%, 0.8)`);
                    gradient.addColorStop(0.7, `hsla(${particle.color.h}, ${particle.color.s}%, ${particle.color.l}%, 0.3)`);
                    gradient.addColorStop(1, 'transparent');

                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();
                });
            }

            drawWaveform(audioData) {
                if (!audioData) return;

                const centerY = this.canvas.height / 2;
                const bassIntensity = audioData.bass / 255;

                // 绘制频谱波形
                this.ctx.beginPath();
                this.ctx.strokeStyle = `hsla(${(this.time * 0.5) % 360}, 70%, 60%, 0.6)`;
                this.ctx.lineWidth = 2 + bassIntensity * 4;

                const step = this.canvas.width / audioData.raw.length;

                for (let i = 0; i < audioData.raw.length; i++) {
                    const x = i * step;
                    const y = centerY + (audioData.raw[i] / 255 - 0.5) * 200 * (1 + bassIntensity);

                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }

                this.ctx.stroke();
            }

            animate() {
                const audioData = this.getFrequencyData();

                this.drawBackground(audioData);
                this.drawParticles(audioData);
                this.drawWaveform(audioData);

                this.time++;
                requestAnimationFrame(() => this.animate());
            }
        }

        // 启动应用
        window.addEventListener('load', () => {
            new AudioVisualizer();
        });
    </script>
</body>

</html>
