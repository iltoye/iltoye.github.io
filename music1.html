<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐可视化动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-btn {
            background: #ff6b6b;
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        input[type="range"] {
            width: 100px;
        }

        .info {
            color: white;
            font-size: 14px;
        }

        .animation-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .animation-btn {
            background: #4ecdc4;
            border: none;
            color: white;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .animation-btn:hover {
            background: #45b7aa;
            transform: scale(1.05);
        }

        .animation-btn.active {
            background: #ff6b6b;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <button class="play-btn" id="playBtn">▶</button>
        <div class="volume-control">
            <span>音量</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="50">
        </div>
        <div class="info">
            <span id="status">点击播放</span>
        </div>
    </div>

    <div class="animation-controls">
        <button class="animation-btn active" data-mode="particles">粒子</button>
        <button class="animation-btn" data-mode="waves">波浪</button>
        <button class="animation-btn" data-mode="spiral">螺旋</button>
        <button class="animation-btn" data-mode="bars">频谱</button>
    </div>

    <script>
        class MusicVisualizer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.playBtn = document.getElementById('playBtn');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.status = document.getElementById('status');

                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.source = null;
                this.isPlaying = false;
                this.animationMode = 'particles';

                this.particles = [];
                this.time = 0;

                this.init();
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                this.playBtn.addEventListener('click', () => this.togglePlay());
                this.volumeSlider.addEventListener('input', (e) => this.setVolume(e.target.value));

                // 动画模式切换
                document.querySelectorAll('.animation-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.animation-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.animationMode = e.target.dataset.mode;
                    });
                });

                this.createParticles();
                this.animate();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            async togglePlay() {
                if (!this.isPlaying) {
                    await this.startAudio();
                } else {
                    this.stopAudio();
                }
            }

            async startAudio() {
                try {
                    // 创建音频上下文
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();

                    // 创建振荡器（生成音调）
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();

                    // 设置分析器
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

                    // 连接音频节点
                    oscillator.connect(gainNode);
                    gainNode.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);

                    // 设置音调（可以改为加载音频文件）
                    oscillator.frequency.setValueAtTime(220, this.audioContext.currentTime);
                    oscillator.type = 'sine';

                    // 设置音量
                    gainNode.gain.setValueAtTime(this.volumeSlider.value / 100, this.audioContext.currentTime);

                    // 开始播放
                    oscillator.start();

                    this.isPlaying = true;
                    this.playBtn.textContent = '⏸';
                    this.status.textContent = '正在播放';

                } catch (error) {
                    console.error('音频播放失败:', error);
                    this.status.textContent = '播放失败';
                }
            }

            stopAudio() {
                if (this.audioContext) {
                    this.audioContext.close();
                    this.audioContext = null;
                }
                this.isPlaying = false;
                this.playBtn.textContent = '▶';
                this.status.textContent = '已停止';
            }

            setVolume(value) {
                // 音量控制逻辑
            }

            createParticles() {
                this.particles = [];
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        color: `hsl(${Math.random() * 360}, 70%, 60%)`
                    });
                }
            }

            getAudioData() {
                if (this.analyser && this.dataArray) {
                    this.analyser.getByteFrequencyData(this.dataArray);
                    return this.dataArray;
                }
                return new Uint8Array(128).fill(Math.random() * 255); // 模拟数据
            }

            drawParticles(audioData) {
                const avgFreq = audioData.reduce((a, b) => a + b) / audioData.length;

                this.particles.forEach((particle, index) => {
                    const freq = audioData[index % audioData.length] || 0;

                    // 根据音频数据调整粒子
                    particle.size = 1 + (freq / 255) * 5;
                    particle.vx += (Math.random() - 0.5) * 0.1;
                    particle.vy += (Math.random() - 0.5) * 0.1;

                    // 更新位置
                    particle.x += particle.vx;
                    particle.y += particle.vy;

                    // 边界检测
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.vy *= -1;

                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = particle.color;
                    this.ctx.fill();
                });
            }

            drawWaves(audioData) {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                this.ctx.beginPath();
                this.ctx.strokeStyle = `hsl(${this.time % 360}, 70%, 60%)`;
                this.ctx.lineWidth = 2;

                for (let i = 0; i < audioData.length; i++) {
                    const angle = (i / audioData.length) * Math.PI * 2;
                    const radius = 100 + (audioData[i] / 255) * 200;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;

                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }

                this.ctx.closePath();
                this.ctx.stroke();
            }

            drawSpiral(audioData) {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                this.ctx.beginPath();
                this.ctx.strokeStyle = `hsl(${this.time % 360}, 70%, 60%)`;
                this.ctx.lineWidth = 3;

                for (let i = 0; i < audioData.length * 3; i++) {
                    const angle = (i / 10) + this.time * 0.01;
                    const radius = (i / 5) + (audioData[i % audioData.length] / 255) * 50;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;

                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }

                this.ctx.stroke();
            }

            drawBars(audioData) {
                const barWidth = this.canvas.width / audioData.length;

                for (let i = 0; i < audioData.length; i++) {
                    const barHeight = (audioData[i] / 255) * this.canvas.height * 0.8;
                    const x = i * barWidth;
                    const y = this.canvas.height - barHeight;

                    this.ctx.fillStyle = `hsl(${(i / audioData.length) * 360}, 70%, 60%)`;
                    this.ctx.fillRect(x, y, barWidth - 1, barHeight);
                }
            }

            animate() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const audioData = this.getAudioData();
                this.time++;

                switch (this.animationMode) {
                    case 'particles':
                        this.drawParticles(audioData);
                        break;
                    case 'waves':
                        this.drawWaves(audioData);
                        break;
                    case 'spiral':
                        this.drawSpiral(audioData);
                        break;
                    case 'bars':
                        this.drawBars(audioData);
                        break;
                }

                requestAnimationFrame(() => this.animate());
            }
        }

        // 启动应用
        window.addEventListener('load', () => {
            new MusicVisualizer();
        });
    </script>
</body>

</html>
